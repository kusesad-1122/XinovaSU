name: Build Manager APK

# 本机没有 JDK / Android SDK，管理器 APK 只能在这里编。
#
# 踩过的坑（都已规避）：
#  1) 版本号来自 `git rev-list --count HEAD` 与 `git describe --tags`，
#     checkout 必须取全量历史 + tags，否则 versionCode / versionName 会算错。
#  2) 不用 android-actions/setup-android：runner 自带 Android SDK，而那个
#     action 还停在 Node 20，runner 已经是 Node 24 → 一上来就 exit 1。
#  3) 所有 actions 用 v5：v4 一代同样是 Node 20，会被强制降级运行。

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cpu-spoof-gki
      - main
    paths:
      - 'manager/**'
      - '.github/workflows/build-manager.yml'

jobs:
  manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK (preinstalled on runner)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          echo "SM=$SM"
          [ -n "$SM" ] || { echo "NO_SDKMANAGER"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SM=$SM" >> "$GITHUB_ENV"
          "$SM" --version || true

      - name: Install SDK / NDK packages
        run: |
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 / build-tools 37.0.0 / NDK 29.0.x 偏新，
          # 稳定通道没有时退回 canary 通道再试；单个包失败不中断其余的。
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"; do
            echo "===== install $pkg ====="
            "$SM" "$pkg" || "$SM" --channel=3 "$pkg" || echo "PKG_FAILED=$pkg"
          done
          echo "===== installed ====="
          "$SM" --list_installed || true

      - name: Show toolchain versions
        run: |
          cd manager
          ./gradlew --version

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > manager/local.properties
          cat manager/local.properties

      - name: Build (debug + release, tolerate one failing)
        run: |
          cd manager
          ./gradlew :app:assembleDebug :app:assembleRelease --continue --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          find manager/app/build/outputs -name '*.apk' -printf '%p  %s bytes\n' || true
          find manager/app/build/outputs -name '*.apk' -exec cp {} dist/ \; || true
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "NO_APK_PRODUCED"
            find manager/app/build/outputs -maxdepth 4 -type d || true
          else
            ls -l dist
            sha256sum dist/*.apk
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: XinovaSU-manager-apk
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 14
