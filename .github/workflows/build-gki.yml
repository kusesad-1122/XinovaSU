name: Build GKI + XinovaSU

# 编译通用 GKI 内核 (6.6) 并把 XinovaSU 内置进去, 产物是一个 Image,
# 塞进 AnyKernel3 外壳即可刷入。目标设备: KMI 为 android15-6.6 的 OPLUS /
# 天玑 / 骁龙设备 (GKI 内核跨 SoC, 平台驱动在 vendor_dlkm)。
#
# 触发方式:
#   1) push 改动到 kernel/ 或本文件
#   2) Actions 页面手动 Run workflow (可选分支 / LTO)

on:
  push:
    paths:
      - '.github/workflows/build-gki.yml'
      - 'kernel/**'
  workflow_dispatch:
    inputs:
      kmi_branch:
        description: 'AOSP GKI manifest branch (e.g. common-android15-6.6)'
        required: true
        default: 'common-android15-6.6'
      lto:
        description: 'LTO mode: thin | none | full'
        required: true
        default: 'thin'
      upload_to_server:
        description: 'Push the built Image to the licensing server (needs SERVER_URL + ADMIN_TOKEN secrets)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KMI_BRANCH: ${{ inputs.kmi_branch || 'common-android15-6.6' }}
      LTO_MODE: ${{ inputs.lto || 'thin' }}
      KMI_TAG: ${{ inputs.kmi_branch || 'common-android15-6.6' }}

    steps:
      - name: Checkout XinovaSU
        uses: actions/checkout@v4
        with:
          path: xinovasu

      # GKI 构建要 ~100GB, runner 只有 14GB 可用 —— 社区标准做法是先删掉
      # 预装的无用 SDK (dotnet / Android NDK / CodeQL 等), 能腾出 30GB+。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git curl bc bison flex libssl-dev libelf-dev \
            zip unzip build-essential kmod cpio lz4 python3 ccache

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: repo init + sync (depth=1)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/gki"
          cd "$GITHUB_WORKSPACE/gki"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "$KMI_BRANCH"
          repo sync -c -j"$(nproc --all)" --no-tags --fail-fast
          du -sh "$GITHUB_WORKSPACE/gki"

      # setup.sh 优先用本仓库的 kernel/, 不会去 clone 上游 KernelSU。
      # 必须看到 "[+] Using bundled kernel/ at ..." —— 没有就说明集成错了。
      - name: Integrate XinovaSU into the kernel tree
        run: |
          cd "$GITHUB_WORKSPACE/gki/common"
          bash "$GITHUB_WORKSPACE/xinovasu/kernel/setup.sh"
          echo "--- drivers/Makefile ---"
          grep -n 'kernelsu' drivers/Makefile || { echo "::error::setup.sh did not patch drivers/Makefile"; exit 1; }
          echo "--- drivers/Kconfig ---"
          grep -n 'kernelsu' drivers/Kconfig || { echo "::error::setup.sh did not patch drivers/Kconfig"; exit 1; }

      - name: Enable CONFIG_KSU=y
        run: |
          cd "$GITHUB_WORKSPACE/gki/common"
          if ! grep -q '^CONFIG_KSU=' arch/arm64/configs/gki_defconfig; then
            echo 'CONFIG_KSU=y' >> arch/arm64/configs/gki_defconfig
          fi
          tail -5 arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE/gki"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=20G || true
          ccache --set-config=compression=true || true
          mkdir -p out
          LTO="$LTO_MODE" BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$GITHUB_WORKSPACE/gki/out" -name 'Image' -o -name 'Image.lz4' -o -name 'Image.gz' \
            | while read -r f; do echo "found: $f"; cp "$f" "$GITHUB_WORKSPACE/dist/"; done
          ls -lh "$GITHUB_WORKSPACE/dist" || true
          test -f "$GITHUB_WORKSPACE/dist/Image" || { echo "::error::no Image produced"; exit 1; }
          sha256sum "$GITHUB_WORKSPACE/dist/Image"

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ inputs.kmi_branch || 'android15-6.6' }}-Image
          path: dist/
          retention-days: 30

      # 可选: 直接把镜像推到授权服务器 (gki/gki-<kmi>.img), 管理器随后就能拉。
      # 需要仓库 secrets: SERVER_URL (如 http://1.2.3.4:8443) 与 ADMIN_TOKEN。
      - name: Push to licensing server
        if: ${{ inputs.upload_to_server }}
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::SERVER_URL / ADMIN_TOKEN secrets are not set"; exit 1
          fi
          KMI="android15-6.6"
          curl -sS --fail -X POST \
            "$SERVER_URL/admin/upload-gki?kmi=$KMI&kind=img&token=$ADMIN_TOKEN" \
            --data-binary @"$GITHUB_WORKSPACE/dist/Image" | tee /tmp/upload.json
          echo
          echo "server response above (expect ok:true + sha256)"
